server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: crm-app
    static_configs:
      - targets: [localhost]
        labels:
          job: crm-app
          service: app
          __path__: /var/log/crm/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            method: method
            path: path
            status: status
            type: type
      - labels:
          level:
          method:
          status:
          type:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/access.log
